name: Probar que compila

# Ramas prueba-*: solo compila el código (no publica nada ni dispara la actualización de la app).
on:
  push:
    branches: ['prueba-**']

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        run: gradle compileReleaseKotlin --no-daemon
