name: Laboratorio

# Corre Solaris en un celular virtual (Pixel 6) con una estación de ejemplo: fotografía cada pantalla de día
# y de noche y mide los cuadros que se traban. Deja las fotos y los números como artefacto "laboratorio".
on:
  workflow_dispatch:
  push:
    branches: ['laboratorio**']

permissions:
  contents: write

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar el laboratorio
        run: gradle assembleLaboratorio assembleLaboratorioAndroidTest --no-daemon
      - name: Correr el recorrido en el celular virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle connectedLaboratorioAndroidTest --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || echo "el recorrido falló"
            adb root || true
            sleep 3
            adb pull /sdcard/Android/data/com.sebas.solaris/files/lab lab || echo "no hay lab"
            adb logcat -d > lab/logcat.txt || true
      - name: Guardar fotos y números
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio
          path: |
            lab/
            app/build/reports/androidTests/
          if-no-files-found: warn
      - name: Subir al release "laboratorio" (para revisarlo desde cualquier lado)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd lab 2>/dev/null || exit 0
          zip -q -r ../laboratorio.zip .
          cd ..
          gh release view laboratorio >/dev/null 2>&1 || gh release create laboratorio --prerelease --title "Laboratorio" --notes "Capturas y medidas del último recorrido del laboratorio."
          gh release upload laboratorio laboratorio.zip --clobber
